<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="barbellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="64" height="64" rx="16" fill="#09090b"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#27272a" stroke-width="1.5"/>

  <!-- Flame Body with Glow -->
  <g filter="url(#glow)">
    <path d="M32 8 C33 16 39 21 44 26 C49 31 52 38 50 45 C48 53 40 57 32 57 C24 57 16 53 14 45 C12 37 16 30 22 25 C23 30 26 34 30 35 C29 30 30 22 36 17 C34 21 34 25 36 28 C37 25 38 20 37 16 C35 12 33 10 32 8 Z"
          fill="url(#flameGrad)" />
  </g>

  <!-- Stylized Barbell / Core Accent -->
  <g fill="url(#barbellGrad)">
    <!-- Central Bar -->
    <rect x="20" y="38" width="24" height="3" rx="1.5"/>
    <!-- Inner Collars -->
    <rect x="24" y="36.5" width="2" height="6" rx="0.8"/>
    <rect x="38" y="36.5" width="2" height="6" rx="0.8"/>
    <!-- Outer Weight Plates -->
    <rect x="21" y="34" width="2.5" height="11" rx="1"/>
    <rect x="40.5" y="34" width="2.5" height="11" rx="1"/>
  </g>

  <!-- Flame Inner Core Accent -->
  <path d="M32 30 C34 35 37 39 36 44 C35 48 31 51 28 50 C32 49 34 46 33 43 C32 40 30 37 32 30 Z"
        fill="#fef08a" opacity="0.9"/>
</svg>

